<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAMS — Mantenimiento de activos · Rodrigo Mendoza Cortés</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet" />
<style>
body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;
background-color:#faf6ec;background-image:radial-gradient(#d9d2bf 1.15px,transparent 1.15px);background-size:22px 22px;
font-family:'Plus Jakarta Sans',sans-serif;color:#2b2822;padding:24px}
.note{background:#fffdf7;border:2.5px solid #2b2822;border-radius:255px 18px 225px 18px/18px 225px 18px 255px;
box-shadow:5px 6px 0 rgba(43,40,34,.85);padding:52px 44px;max-width:520px;text-align:center;position:relative;transform:rotate(-.6deg)}
.note::before{content:"";position:absolute;top:-14px;left:50%;width:96px;height:28px;transform:translateX(-50%) rotate(-2deg);
background:rgba(255,216,77,.55);border-left:1px dashed rgba(43,40,34,.25);border-right:1px dashed rgba(43,40,34,.25)}
h1{font-weight:800;font-size:1.5rem;letter-spacing:-.02em;margin:0 0 10px}
.hand{font-family:'Caveat',cursive;font-weight:700;font-size:1.7rem;color:#3556c7;display:block;margin-bottom:6px;transform:rotate(-1.5deg)}
p{color:#6d6759;font-size:.92rem;line-height:1.6;margin:0 0 26px}
a{font-weight:700;font-size:.9rem;color:#2b2822;text-decoration:none;border:2px solid #2b2822;
border-radius:255px 18px 225px 18px/18px 225px 18px 255px;padding:10px 24px;background:#ffd84d;
box-shadow:3px 4px 0 #2b2822;display:inline-block;transition:all .2s}
a:hover{transform:translate(-2px,-2px);box-shadow:5px 6px 0 #2b2822}

.lang-toggle{display:inline-flex;align-items:center;gap:5px;font-family:'Plus Jakarta Sans',sans-serif;
font-size:.72rem;font-weight:800;letter-spacing:.06em;border:2px solid #2b2822;border-radius:999px;
padding:5px 13px;background:#fffdf7;color:#6d6759;cursor:pointer;box-shadow:2.5px 3px 0 #2b2822;
transition:all .2s;transform:rotate(.8deg);margin-bottom:18px}
.lang-toggle:hover{transform:rotate(.8deg) translate(-1px,-1px);box-shadow:4px 5px 0 #2b2822;background:#ffd84d}
.lang-toggle [data-lang]{opacity:.42}.lang-toggle [data-lang].on{opacity:1;color:#2b2822}
.lang-sep{opacity:.4;font-weight:600}
</style>
</head>
<body>
<div class="note">
<span data-lang-toggle-here></span>
<span class="hand">en construcción ✎</span>
